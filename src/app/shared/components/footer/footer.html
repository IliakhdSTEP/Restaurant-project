
<footer class="footer">
  <div class="footer-container">

    <div class="footer-column">
      <h3 class="footer-logo">Foodie</h3>
      <p>Delicious food delivered to your door</p>

      <div class="social-links">
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
          </svg>
        </a>

        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="18" cy="6" r="1"/>
          </svg>
        </a>

        <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 5.9a8.4 8.4 0 0 1-2.4.7 4.2 4.2 0 0 0 1.8-2.3 8.4 8.4 0 0 1-2.7 1 4.2 4.2 0 0 0-7.2 3.8A11.9 11.9 0 0 1 3 4.8a4.2 4.2 0 0 0 1.3 5.6 4.2 4.2 0 0 1-1.9-.5 4.2 4.2 0 0 0 3.4 4.2 4.2 0 0 1-1.9.1 4.2 4.2 0 0 0 3.9 2.9A8.4 8.4 0 0 1 2 17.3a11.9 11.9 0 0 0 18.3-10.1A8.5 8.5 0 0 0 22 5.9z"/>
          </svg>
        </a>
      </div>
    </div>

    <div class="footer-column">
      <h3>Contact</h3>
      <p>123 Food Street</p>
      <p>City, State 12345</p>
      <p>Phone: (555) 123-4567</p>
      <p>Mon-Sun: 10AM - 10PM</p>
    </div>

    <div class="footer-column">
      <h3>Quick Links</h3>
      <a routerLink="/menu">Menu</a>
      <a routerLink="/" fragment="about">About</a>
      <a href="mailto:info@foodie.com">Contact</a>
      <a href="#terms">Terms of Service</a>
      <a href="#privacy">Privacy Policy</a>
    </div>

    <div class="footer-column newsletter">
      <h3>Newsletter</h3>
      <p>Subscribe to get special offers</p>

      <form class="newsletter-form" (ngSubmit)="subscribe()">
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Your email"
          required
        />
        <button type="submit">Subscribe</button>
      </form>
    </div>

  </div>

  <div class="footer-bottom">
    <a href="https://ge.itstep.org/" target="_blank" rel="noopener noreferrer">
      Created by: <span>IT Academy STEP Georgia</span>
    </a>
  </div>
</footer>
